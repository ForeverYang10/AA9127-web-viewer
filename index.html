<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLE Wi-Fi Provisioning Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-6">
    
    <!-- 標頭資訊 -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold text-emerald-400">ESP32-S3 Wi-Fi 配網</h1>
      <p class="text-slate-400 text-sm">透過 Web BLE 傳送無線網路認證資訊</p>
    </div>

    <!-- 裝置連線即時狀態指示燈 -->
    <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span id="device-status-dot" class="w-3 h-3 rounded-full bg-slate-500 animate-pulse"></span>
        <span class="text-xs text-slate-300 font-medium">裝置狀態：</span>
      </div>
      <span id="device-status-text" class="text-xs text-slate-400 font-mono">未連線</span>
    </div>

    <!-- 環境安全檢查提示 -->
    <div id="env-warning" class="hidden bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 text-amber-400 text-xs">
      ⚠️ 您的瀏覽器目前不支援 Web BLE，或是目前的連線並非 HTTPS / Localhost 環境。
    </div>

    <!-- Wi-Fi 設定表單 -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Wi-Fi 名稱 (SSID)</label>
        <input id="wifi-ssid" type="text" placeholder="請輸入 Wi-Fi 名稱"
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Wi-Fi 密碼 (Password)</label>
        <div class="relative">
          <input id="wifi-pass" type="password" placeholder="請輸入 Wi-Fi 密碼"
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 text-sm pr-10">
          <button type="button" id="toggle-pass-btn" onclick="togglePassVisibility()" class="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-slate-200">
            顯示
          </button>
        </div>
      </div>

      <!-- 記住資訊 (localStorage) 提示與清除鈕 -->
      <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
        <span class="flex items-center gap-1">
          <span class="inline-block w-2 h-2 bg-emerald-500 rounded-full"></span>
          自動儲存至 LocalStorage
        </span>
        <button onclick="clearCachedCredentials()" class="text-rose-400 hover:underline">清除快取</button>
      </div>
    </div>

    <!-- 連線觸發按鈕 -->
    <button id="ble-connect-btn" onclick="startBLEProvisioning()" 
            class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg shadow-emerald-900/30">
      🔍 搜尋並傳送設定至 ESP32
    </button>

    <!-- 狀態顯示區域 -->
    <div id="status-log" class="bg-slate-900/80 rounded-lg p-3 text-xs font-mono text-slate-300 border border-slate-800 h-28 overflow-y-auto space-y-1">
      <div class="text-slate-500">> 等待開始...</div>
    </div>

  </div>

  <script>
    const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26ae';

    window.addEventListener('DOMContentLoaded', () => {
      checkEnvironment();
      loadCachedCredentials();
    });

    function checkEnvironment() {
      const isSecure = window.isSecureContext || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (!navigator.bluetooth || !isSecure) {
        document.getElementById('env-warning').classList.remove('hidden');
      }
    }

    // 更新頂部裝置狀態 UI
    function updateDeviceStatus(state, text) {
      const dot = document.getElementById('device-status-dot');
      const statusText = document.getElementById('device-status-text');
      
      dot.className = "w-3 h-3 rounded-full animate-pulse";
      if (state === 'connected') {
        dot.classList.add('bg-emerald-500');
      } else if (state === 'connecting') {
        dot.classList.add('bg-amber-400');
      } else if (state === 'error') {
        dot.classList.add('bg-rose-500');
      } else {
        dot.classList.add('bg-slate-500');
        dot.classList.remove('animate-pulse');
      }
      statusText.textContent = text;
    }

    function log(msg, type = 'info') {
      const logBox = document.getElementById('status-log');
      const time = new Date().toLocaleTimeString('zh-TW', { hour12: false });
      let colorClass = 'text-slate-300';
      if (type === 'success') colorClass = 'text-emerald-400 font-bold';
      if (type === 'error') colorClass = 'text-rose-400 font-bold';
      
      const entry = document.createElement('div');
      entry.className = colorClass;
      entry.textContent = `[${time}] ${msg}`;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function togglePassVisibility() {
      const passInput = document.getElementById('wifi-pass');
      const btn = document.getElementById('toggle-pass-btn');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        btn.textContent = '隱藏';
      } else {
        passInput.type = 'password';
        btn.textContent = '顯示';
      }
    }

    function loadCachedCredentials() {
      const savedSsid = localStorage.getItem('ble_wifi_ssid');
      const savedPass = localStorage.getItem('ble_wifi_pass');
      if (savedSsid) document.getElementById('wifi-ssid').value = savedSsid;
      if (savedPass) document.getElementById('wifi-pass').value = savedPass;
      if (savedSsid) log('已自動帶入歷史 Wi-Fi 設定。');
    }

    function saveCredentials(ssid, pass) {
      localStorage.setItem('ble_wifi_ssid', ssid);
      localStorage.setItem('ble_wifi_pass', pass);
    }

    function clearCachedCredentials() {
      localStorage.removeItem('ble_wifi_ssid');
      localStorage.removeItem('ble_wifi_pass');
      document.getElementById('wifi-ssid').value = '';
      document.getElementById('wifi-pass').value = '';
      log('已清除 LocalStorage 快取資訊。');
    }

    async function startBLEProvisioning() {
      const ssid = document.getElementById('wifi-ssid').value.trim();
      const pass = document.getElementById('wifi-pass').value.trim();

      if (!ssid) {
        alert('請先輸入 Wi-Fi 名稱 (SSID)');
        return;
      }

      saveCredentials(ssid, pass);

      if (!navigator.bluetooth) {
        log('您的瀏覽器不支援 Web Bluetooth API。', 'error');
        return;
      }

      try {
        log('正在掃描 BLE 裝置...');
        updateDeviceStatus('connecting', '掃描中...');

        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'DK_AirBed' }],
          optionalServices: [SERVICE_UUID]
        });

        log(`已找到裝置：${device.name}，正在建立 GATT 連線...`);
        updateDeviceStatus('connecting', '連接藍牙中...');

        const server = await device.gatt.connect();
        updateDeviceStatus('connected', `已連線 (${device.name})`);

        log('取得 BLE 服務...');
        const service = await server.getPrimaryService(SERVICE_UUID);

        log('取得 BLE 特徵...');
        const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        // 啟用藍牙通知 (接收 ESP32 傳回的 Wi-Fi 連線狀態回饋)
        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', (event) => {
          const value = new TextDecoder().decode(event.target.value);
          log(`裝置回報: ${value}`, 'success');
          updateDeviceStatus('connected', value);
        });

        // 寫入 Wi-Fi 帳密
        const payload = JSON.stringify({ ssid: ssid, pass: pass });
        const encoder = new TextEncoder();
        
        log('正在寫入 Wi-Fi 帳密資訊...');
        await characteristic.writeValue(encoder.encode(payload));
        log('✅ 帳密已送出，等待 ESP32 連線 Wi-Fi...', 'success');

      } catch (err) {
        updateDeviceStatus('error', '連線失敗');
        if (err.name === 'NotFoundError') {
          log('使用者取消了裝置選擇。', 'info');
        } else {
          // ⚠️ 把完整的錯誤名稱與訊息印出來
          log(`連線失敗錯誤 [${err.name}]: ${err.message}`, 'error');
        }
      }
    }
  </script>
</body>
</html>
