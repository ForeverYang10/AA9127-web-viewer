<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLE Wi-Fi Provisioning & Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: sans-serif;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-6">

        <!-- 標頭資訊 -->
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-bold text-emerald-400">Wi-Fi 配網與狀態監控</h1>
            <p class="text-slate-400 text-sm">透過 Web BLE 傳送認證資訊與即時心跳監控</p>
        </div>

        <!-- 裝置連線狀態儀表板 -->
        <div class="grid grid-cols-2 gap-3 bg-slate-900/60 p-3 rounded-xl border border-slate-700/60">
            <!-- BLE 狀態 -->
            <div class="flex items-center space-x-2">
                <span id="ble-dot" class="w-3 h-3 bg-slate-500 rounded-full inline-block transition-colors"></span>
                <div>
                    <div class="text-[10px] text-slate-400 font-medium">藍牙 (BLE)</div>
                    <div id="ble-status-text" class="text-xs font-bold text-slate-300">未連線</div>
                </div>
            </div>
            <!-- Wi-Fi 雲端狀態 -->
            <div class="flex items-center space-x-2">
                <span id="wifi-dot" class="w-3 h-3 bg-slate-500 rounded-full inline-block transition-colors"></span>
                <div>
                    <div class="text-[10px] text-slate-400 font-medium">裝置狀態</div>
                    <div id="wifi-status-text" class="text-xs font-bold text-slate-300">檢查中...</div>
                </div>
            </div>
        </div>

        <!-- 最後心跳時間與時區提示 -->
        <div class="bg-slate-900/40 px-3 py-2 rounded-lg border border-slate-800 text-xs text-slate-400 flex justify-between items-center">
            <span id="updateTime">最後心跳時間: --</span>
            <span class="text-[10px] text-slate-500">時區: 台北 (GMT+8)</span>
        </div>

        <!-- Wi-Fi 設定表單 -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Wi-Fi 名稱 (SSID)</label>
                <input id="wifi-ssid" type="text" placeholder="請輸入 Wi-Fi 名稱"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Wi-Fi 密碼 (Password)</label>
                <div class="relative">
                    <input id="wifi-pass" type="password" placeholder="請輸入 Wi-Fi 密碼"
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 text-sm pr-10">
                    <button type="button" id="toggle-pass-btn" onclick="togglePassVisibility()"
                        class="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-slate-200">
                        顯示
                    </button>
                </div>
            </div>

            <!-- LocalStorage 提示與清除鈕 -->
            <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
                <span class="flex items-center gap-1">
                    <span class="inline-block w-2 h-2 bg-emerald-500 rounded-full"></span>
                    自動儲存至 LocalStorage
                </span>
                <button onclick="clearCachedCredentials()" class="text-rose-400 hover:underline">清除快取</button>
            </div>
        </div>

        <!-- 連線觸發按鈕 -->
        <button onclick="startBLEProvisioning()"
            class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg shadow-emerald-900/30">
            🔍 搜尋並傳送設定至裝置
        </button>

        <!-- 狀態顯示區域 -->
        <div id="status-log"
            class="bg-slate-900/80 rounded-lg p-3 text-xs font-mono text-slate-300 border border-slate-800 h-32 overflow-y-auto space-y-1">
            <div class="text-slate-500">> 等待開始...</div>
        </div>

    </div>

    <script>
        const SERVICE_UUID = '090de95a-079a-42e1-bde7-78f4b98728c0';
        const CHAR_RX_UUID = '090de95a-079a-42e1-bde7-78f4b98728c1
