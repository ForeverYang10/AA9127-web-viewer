<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLE Wi-Fi Provisioning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-6">
    
    <!-- 標頭資訊 -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold text-emerald-400">BLE 裝置配網</h1>
      <p class="text-slate-400 text-sm">透過藍牙傳送設定資料</p>
    </div>

    <!-- Wi-Fi 設定表單 -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Wi-Fi 名稱 (SSID)</label>
        <input id="wifi-ssid" type="text" placeholder="請輸入 Wi-Fi 名稱"
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Wi-Fi 密碼 (Password)</label>
        <input id="wifi-pass" type="password" placeholder="請輸入 Wi-Fi 密碼"
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 text-sm">
      </div>
    </div>

    <!-- 連線觸發按鈕 -->
    <button onclick="startBLEProvisioning()" 
            class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg transition">
      🔍 搜尋並傳送設定
    </button>

    <!-- 狀態顯示區域 -->
    <div id="status-log" class="bg-slate-900/80 rounded-lg p-3 text-xs font-mono text-slate-300 border border-slate-800 h-28 overflow-y-auto space-y-1">
      <div class="text-slate-500">> 等待開始...</div>
    </div>

  </div>

  <script>
    // 引用您指定的標準 UUID 架構
    const SERVICE_UUID = '090de95a-079a-42e1-bde7-78f4b98728c0';[cite: 1]
    const CHAR_RX_UUID  = '090de95a-079a-42e1-bde7-78f4b98728c1';[cite: 1]
    const CHAR_TX_UUID  = '090de95a-079a-42e1-bde7-78f4b98728c2';[cite: 1]

    let rxCharacteristic;
    let txCharacteristic;

    function log(msg, type = 'info') {
      const logBox = document.getElementById('status-log');
      const time = new Date().toLocaleTimeString('zh-TW', { hour12: false });
      let colorClass = 'text-slate-300';
      if (type === 'success') colorClass = 'text-emerald-400 font-bold';
      if (type === 'error') colorClass = 'text-rose-400 font-bold';
      
      const entry = document.createElement('div');
      entry.className = colorClass;
      entry.textContent = `[${time}] ${msg}`;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function startBLEProvisioning() {
      const ssid = document.getElementById('wifi-ssid').value.trim();
      const pass = document.getElementById('wifi-pass').value.trim();

      if (!ssid) {
        alert('請先輸入 Wi-Fi SSID');
        return;
      }

      if (!navigator.bluetooth) {
        log('瀏覽器不支援 Web Bluetooth', 'error');
        return;
      }

      try {
        log('正在搜尋藍牙裝置...');
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'DK_AirBed_' }],[cite: 1]
          optionalServices: [SERVICE_UUID][cite: 1]
        });

        log(`已選擇裝置: ${device.name}`);
        const server = await device.gatt.connect();

        log('取得 BLE 服務...');
        const service = await server.getPrimaryService(SERVICE_UUID);[cite: 1]
        rxCharacteristic = await service.getCharacteristic(CHAR_RX_UUID);[cite: 1]
        txCharacteristic = await service.getCharacteristic(CHAR_TX_UUID);[cite: 1]

        await txCharacteristic.startNotifications();[cite: 1]
        txCharacteristic.addEventListener('characteristicvaluechanged', (e) => {
          const val = new TextDecoder().decode(e.target.value);[cite: 1]
          log(`裝置回報: ${val}`, 'success');
        });

        const encoder = new TextEncoder();
        log('正在發送 SSID...');
        await rxCharacteristic.writeValue(encoder.encode(JSON.stringify({ ssid })));[cite: 1]

        log('正在發送 Password...');
        await rxCharacteristic.writeValue(encoder.encode(JSON.stringify({ pw: pass })));[cite: 1]

        log('✅ 設定已全數送出！', 'success');
        device.gatt.disconnect();

      } catch (err) {
        if (err.name === 'NotFoundError') {
          log('使用者取消了裝置選擇。', 'info');
        } else {
          log(`錯誤: ${err.message}`, 'error');
        }
      }
    }
  </script>
</body>
</html>
