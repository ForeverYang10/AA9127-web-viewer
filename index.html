<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLE Wi-Fi Provisioning (穩定版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-6">
    
    <!-- 標頭資訊 -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold text-emerald-400">ESP32-S3 Wi-Fi 配網</h1>
      <p class="text-slate-400 text-sm">透過 Web BLE 傳送無線網路認證資訊</p>
    </div>

    <!-- 裝置連線即時狀態指示燈 -->
    <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span id="device-status-dot" class="w-3 h-3 rounded-full bg-slate-500 animate-pulse"></span>
        <span class="text-xs text-slate-300 font-medium">裝置狀態：</span>
      </div>
      <span id="device-status-text" class="text-xs text-slate-400 font-mono">未連線</span>
    </div>

    <!-- Wi-Fi 設定表單 -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Wi-Fi 名稱 (SSID)</label>
        <input id="wifi-ssid" type="text" placeholder="請輸入 Wi-Fi 名稱"
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Wi-Fi 密碼 (Password)</label>
        <div class="relative">
          <input id="wifi-pass" type="password" placeholder="請輸入 Wi-Fi 密碼"
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 text-sm pr-10">
          <button type="button" id="toggle-pass-btn" onclick="togglePassVisibility()" class="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-slate-200">
            顯示
          </button>
        </div>
      </div>
    </div>

    <!-- 連線觸發按鈕 -->
    <button id="ble-connect-btn" onclick="startBLEProvisioning()" 
            class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg shadow-emerald-900/30">
      🔍 搜尋並傳送設定至 ESP32
    </button>

    <!-- 狀態顯示區域 -->
    <div id="status-log" class="bg-slate-900/80 rounded-lg p-3 text-xs font-mono text-slate-300 border border-slate-800 h-36 overflow-y-auto space-y-1">
      <div class="text-slate-500">> 等待開始...</div>
    </div>

  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const savedSsid = localStorage.getItem('ble_wifi_ssid');
      const savedPass = localStorage.getItem('ble_wifi_pass');
      if (savedSsid) document.getElementById('wifi-ssid').value = savedSsid;
      if (savedPass) document.getElementById('wifi-pass').value = savedPass;
    });

    function updateDeviceStatus(state, text) {
      const dot = document.getElementById('device-status-dot');
      const statusText = document.getElementById('device-status-text');
      dot.className = "w-3 h-3 rounded-full animate-pulse";
      if (state === 'connected') dot.classList.add('bg-emerald-500');
      else if (state === 'connecting') dot.classList.add('bg-amber-400');
      else if (state === 'error') dot.classList.add('bg-rose-500');
      else dot.classList.add('bg-slate-500');
      statusText.textContent = text;
    }

    function log(msg, type = 'info') {
      const logBox = document.getElementById('status-log');
      const time = new Date().toLocaleTimeString('zh-TW', { hour12: false });
      let colorClass = 'text-slate-300';
      if (type === 'success') colorClass = 'text-emerald-400 font-bold';
      if (type === 'error') colorClass = 'text-rose-400 font-bold';
      
      const entry = document.createElement('div');
      entry.className = colorClass;
      entry.textContent = `[${time}] ${msg}`;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function togglePassVisibility() {
      const passInput = document.getElementById('wifi-pass');
      const btn = document.getElementById('toggle-pass-btn');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        btn.textContent = '隱藏';
      } else {
        passInput.type = 'password';
        btn.textContent = '顯示';
      }
    }

    // 簡單的延遲等待工具函式
    const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function startBLEProvisioning() {
      const ssid = document.getElementById('wifi-ssid').value.trim();
      const pass = document.getElementById('wifi-pass').value.trim();

      if (!ssid) {
        alert('請先輸入 Wi-Fi 名稱 (SSID)');
        return;
      }

      localStorage.setItem('ble_wifi_ssid', ssid);
      localStorage.setItem('ble_wifi_pass', pass);

      if (!navigator.bluetooth) {
        log('瀏覽器不支援 Web Bluetooth', 'error');
        return;
      }

      try {
        log('正在開啟藍牙選單...');
        updateDeviceStatus('connecting', '選擇裝置中...');

        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b']
        });

        log(`已選擇裝置: ${device.name || '未命名'}`, 'success');
        updateDeviceStatus('connecting', '建立 GATT 連線...');

        const server = await device.gatt.connect();
        
        // 🌟 關鍵修正：連線後強制等待 800 毫秒，讓 ESP32 穩定完成底層交握
        log('GATT 已連線，等待底層服務穩定...');
        await delay(800);

        updateDeviceStatus('connecting', '尋找 BLE 服務...');
        log('取得 BLE 服務...');

        // 直接尋找所有 Services 並挑選第一個可寫入特徵
        const services = await server.getPrimaryServices();
        let targetCharacteristic = null;

        for (const service of services) {
          try {
            const characteristics = await service.getCharacteristics();
            for (const char of characteristics) {
              if (char.properties.write || char.properties.writeWithoutResponse) {
                targetCharacteristic = char;
                log(`🎯 鎖定可寫入特徵: ${char.uuid}`, 'success');
                break;
              }
            }
          } catch (e) {
            // 忽略無法讀取的服務
          }
          if (targetCharacteristic) break;
        }

        if (!targetCharacteristic) {
          throw new Error('找不到任何可寫入的 BLE 特徵！');
        }

        // 打包並寫入
        const payload = JSON.stringify({ ssid: ssid, pass: pass });
        const encoder = new TextEncoder();
        
        updateDeviceStatus('connecting', '正在傳送設定...');
        log('正在寫入 Wi-Fi 帳密...');
        await targetCharacteristic.writeValue(encoder.encode(payload));
        
        log('✅ 帳密寫入成功！', 'success');
        updateDeviceStatus('connected', '設定已傳送');

        device.gatt.disconnect();
      } catch (err) {
        updateDeviceStatus('error', '執行失敗');
        // 清楚分開真實取消與其他錯誤
        if (err.name === 'NotFoundError') {
          log('使用者取消了裝置選擇。', 'info');
        } else {
          log(`錯誤類型 [${err.name}]: ${err.message}`, 'error');
        }
      }
    }
  </script>
</body>
</html>
